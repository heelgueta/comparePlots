# Compare Dichotomous (distDich): RESULTS. Source of truth for both group analyses (see distDich.a.yaml).
# One Image per plot. Each is drawn by the function named in `renderFun` (R/cmpGrpCommon.R) from the state saved in .run().
name: distDich
title: Compare Dichotomous
jrs: '1.1'
refs:
  - comparePlots
  - ggplot2
items:
  - name: hint
    title: ''
    type: Html
    visible: false
  - name: plot_box
    title: Box plot
    type: Image
    width: 480
    height: 380
    renderFun: .plot_box
    visible: (showBox)
    requiresData: true
    clearWith:
      - vars
      - group
      - groupMode
      - orientation
      - sortVars
      - transform
      - useDesc
      - invertVars
      - invertGroups
      - ignoreMissingGroup
      - colourPalette
