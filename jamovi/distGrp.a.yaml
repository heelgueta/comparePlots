---
# Compare Groups (distGrp): OPTIONS.
# Compares one or more numeric variables across levels of a grouping factor.
# jmvtools compiles this file (with distGrp.r.yaml) into R/distGrp.h.R.
name: distGrp
title: Compare Groups
category: plots
menuGroup: comparePlots
menuSubgroup: groups
version: '1.0.0'
jas: '1.2'
options:
  # DATA AND VARIABLES.
  - name: data
    type: Data
  - name: vars
    title: Variables
    type: Variables
    suggested:
      - continuous
    permitted:
      - numeric
  - name: group
    title: Grouping Variable
    type: Variable
    suggested:
      - nominal
      - ordinal
    permitted:
      - factor
  # APPEARANCE: options shared by every plot of this analysis.
  - name: groupMode
    title: Group display
    type: List
    options:
      - name: dodge
        title: Within each variable
      - name: facetGroup
        title: Panels by group
      - name: facetVar
        title: Panels by variable
    default: dodge
  - name: orientation
    title: Orientation
    type: List
    options:
      - name: horizontal
        title: Horizontal
      - name: vertical
        title: Vertical
    default: horizontal
  - name: sortVars
    title: Order variables
    type: List
    options:
      - name: none
        title: Entry
      - name: name
        title: A–Z
      - name: median
        title: Median
      - name: mean
        title: Mean
    default: none
  - name: transform
    title: Transform values
    type: List
    options:
      - name: none
        title: None
      - name: z
        title: z-scores
      - name: log
        title: Natural log
      - name: sqrt
        title: Square root
      - name: square
        title: Square
    default: none
  - name: invertVars
    title: Reverse variable order
    type: Bool
    default: false
  - name: invertGroups
    title: Reverse group order
    type: Bool
    default: false
  - name: useDesc
    title: Variable descriptions as labels
    type: Bool
    default: false
  - name: ignoreMissingGroup
    title: Ignore missing group cases
    type: Bool
    default: true
  - name: colourPalette
    title: Palette
    type: List
    options:
      - name: jamovi
        title: jamovi
      - name: bw
        title: Black & white
      - name: viridis
        title: Viridis
      - name: plasma
        title: Plasma
      - name: magma
        title: Magma
      - name: inferno
        title: Inferno
      - name: cividis
        title: Cividis
      - name: mako
        title: Mako
      - name: rocket
        title: Rocket
      - name: turbo
        title: Turbo
      - name: rainbow
        title: Rainbow
      - name: rdbu
        title: Red–Blue
      - name: rdylgn
        title: Red–Yellow–Green
      - name: piyg
        title: Pink–Green
      - name: prgn
        title: Purple–Green
      - name: brbg
        title: Brown–Teal
      - name: pastel
        title: Pastel 1
      - name: okabe
        title: Okabe–Ito
      - name: grays
        title: Greys
    default: jamovi
  - name: reversePalette
    title: Invert palette
    type: Bool
    default: false
  - name: plotTheme
    title: Theme
    type: List
    options:
      - name: jamovi
        title: jamovi
      - name: minimal
        title: Minimal
      - name: classic
        title: Classic
      - name: bw
        title: 'Black & white'
      - name: light
        title: Light
      - name: gray
        title: Grey
    default: jamovi
  - name: textSize
    title: Text size
    type: Integer
    min: 8
    max: 32
    default: 16
  - name: alpha
    title: Opacity
    type: Integer
    min: 5
    max: 100
    default: 80
  - name: lineWidth
    title: Line thickness (1–5)
    type: Integer
    min: 1
    max: 5
    default: 2
  - name: pointSize
    title: Point size
    type: Number
    min: 0.2
    max: 6
    default: 0.8
  - name: pointAlpha
    title: Data point opacity
    type: Integer
    min: 5
    max: 100
    default: 50
  - name: pointColour
    title: Data point colour
    type: List
    options:
      - name: group
        title: As group
      - name: grey
        title: Grey
    default: group
  - name: jitterSpread
    title: Jitter spread
    type: Integer
    min: 0
    max: 100
    default: 40
  - name: valueLabel
    title: Value axis label
    type: String
    default: Value
  - name: title
    title: Plot title
    type: String
    default: ''
  - name: legendPos
    title: Legend position
    type: List
    options:
      - name: bottom
        title: Bottom
      - name: right
        title: Right
      - name: top
        title: Top
      - name: none
        title: None
    default: bottom
  - name: legendTitle
    title: Legend title
    type: String
    default: ''
  - name: showN
    title: n per group
    type: Bool
    default: false
  # PLOT: Box plot.
  - name: showBox
    title: Box plot
    type: Bool
    default: true
  - name: boxWidth
    title: Box width
    type: Integer
    min: 5
    max: 100
    default: 65
  - name: boxOutliers
    title: Outliers
    type: Bool
    default: true
  - name: boxNotch
    title: Notched (median CI)
    type: Bool
    default: false
  - name: boxMean
    title: Mean marker
    type: Bool
    default: false
  - name: boxJitter
    title: Data points (jittered)
    type: Bool
    default: false
  # PLOT: Violin plot.
  - name: showViolin
    title: Violin plot
    type: Bool
    default: false
  - name: violinWidth
    title: Violin width
    type: Integer
    min: 5
    max: 100
    default: 80
  - name: violinScale
    title: Scale
    type: List
    options:
      - name: area
        title: Equal area
      - name: count
        title: By n
      - name: width
        title: Equal width
    default: area
  - name: violinAdjust
    title: Bandwidth adjust
    type: Number
    min: 0.1
    max: 5
    default: 1
  - name: violinTrim
    title: Trim tails at data range
    type: Bool
    default: true
  - name: violinBox
    title: Inner box
    type: Bool
    default: true
  - name: violinSplit
    title: Split halves (for 2 groups)
    type: Bool
    default: false
  - name: violinJitter
    title: Data points (jittered)
    type: Bool
    default: false
  # PLOT: Means and error bars.
  - name: showErrorBar
    title: Means and error bars
    type: Bool
    default: false
  - name: ebCenter
    title: Centre
    type: List
    options:
      - name: mean
        title: Mean
      - name: median
        title: Median
    default: mean
  - name: ebInterval
    title: Error bars
    type: List
    options:
      - name: ci
        title: Confidence interval
      - name: se
        title: Standard error
      - name: sd
        title: Standard deviation
      - name: iqr
        title: Interquartile range
      - name: pctile
        title: 'Central % of the data'
      - name: range
        title: Min–max
    default: ci
  - name: ebLevel
    title: Level for CI / central %
    type: Integer
    min: 50
    max: 99
    default: 95
  - name: ebMult
    title: Multiplier for SE / SD
    type: Number
    min: 0.5
    max: 5
    default: 1
  - name: ebJitter
    title: Data points (jittered)
    type: Bool
    default: false
  - name: ebSize
    title: Marker size
    type: Number
    min: 1
    max: 10
    default: 3.5
  - name: ebCap
    title: Cap width
    type: Integer
    min: 0
    max: 100
    default: 30
  - name: ebConnect
    title: Line connecting the centres
    type: Bool
    default: false
  - name: ebLabels
    title: Centre values
    type: Bool
    default: false
  # PLOT: Raincloud plot.
  - name: showRaincloud
    title: Raincloud plot
    type: Bool
    default: false
  - name: rcCloudWidth
    title: Cloud height
    type: Integer
    min: 10
    max: 100
    default: 45
  - name: rcAdjust
    title: Bandwidth adjust
    type: Number
    min: 0.1
    max: 5
    default: 1
  - name: rcRain
    title: Rain (data points)
    type: Bool
    default: true
  - name: rcBox
    title: Box
    type: Bool
    default: true
  # PLOT: Ridgeline (density) plot.
  - name: showRidge
    title: Ridgeline (density) plot
    type: Bool
    default: false
  - name: ridgeOverlap
    title: Overlap
    type: Integer
    min: 0
    max: 300
    default: 50
  - name: ridgeAdjust
    title: Bandwidth adjust
    type: Number
    min: 0.1
    max: 5
    default: 1
  - name: ridgeTrim
    title: Trim tails at data range
    type: Bool
    default: false
  - name: ridgeMedian
    title: Median marker
    type: Bool
    default: false
  # PLOT: Histogram.
  - name: showHist
    title: Histogram
    type: Bool
    default: false
  - name: histBins
    title: Number of bins
    type: Integer
    min: 3
    max: 100
    default: 20
  - name: histStat
    title: Bar height
    type: List
    options:
      - name: count
        title: Count
      - name: percent
        title: Percent
      - name: density
        title: Density
    default: percent
  - name: histPosition
    title: Group bars
    type: List
    options:
      - name: identity
        title: Overlaid
      - name: dodge
        title: Side by side
    default: identity
  - name: histDensity
    title: Density curve
    type: Bool
    default: false
  - name: histFreeY
    title: Free height scale per variable
    type: Bool
    default: false
  # PLOT: Overlaid densities.
  - name: showDensity
    title: Overlaid densities
    type: Bool
    default: false
  - name: densAdjust
    title: Bandwidth adjust
    type: Number
    min: 0.1
    max: 5
    default: 1
  - name: densFilled
    title: Filled curves
    type: Bool
    default: true
  - name: densTrim
    title: Trim tails at data range
    type: Bool
    default: false
  # PLOT: Cumulative distribution (ECDF).
  - name: showEcdf
    title: Cumulative distribution (ECDF)
    type: Bool
    default: false
  - name: ecdfMedian
    title: 'Median marker (50%)'
    type: Bool
    default: true
  # PLOT: Data points (strip plot).
  - name: showStrip
    title: Data points (strip plot)
    type: Bool
    default: false
  - name: stripSummary
    title: Summary line
    type: List
    options:
      - name: none
        title: None
      - name: mean
        title: Mean
      - name: median
        title: Median
    default: mean
  # PLOT: Barcode plot.
  - name: showBarcode
    title: Barcode plot
    type: Bool
    default: false
  - name: barcodeHeight
    title: Tick height
    type: Integer
    min: 10
    max: 100
    default: 70
...
