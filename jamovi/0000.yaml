date: '2026-11-25'
category: plots
type: R
description: >-
  Compare the distributions of variables on one shared scale. Numeric variables:
  box, violin, means with error bars, raincloud, ridgeline, histogram, density,
  ECDF, data points and barcode plots, also across two groups (including a
  back-to-back histogram, percentile ladder, lead plot) or three or more groups.
  Ordinal and nominal variables: stacked and diverging bars, heatmap, waffle,
  pictogram, parliament, response profile, pie, donut, grouped bars and lollipop
  plots.
analyses:
