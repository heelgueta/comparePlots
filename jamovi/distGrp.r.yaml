---
# Compare Groups (distGrp): RESULTS.
# One Image per plot. Each is drawn by the function named in `renderFun` (R/distGrp.b.R) from the state saved in .run().
name: distGrp
title: Compare Groups
jrs: '1.1'
refs:
  - comparePlots
  - ggplot2
items:
  - name: hint
    title: ''
    type: Html
    visible: false
  - name: plot_box
    title: Box plot
    type: Image
    width: 480
    height: 380
    renderFun: .plot_box
    visible: (showBox)
    requiresData: true
    clearWith:
      - vars
      - group
      - groupMode
      - orientation
      - sortVars
      - transform
      - useDesc
      - invertVars
      - invertGroups
      - ignoreMissingGroup
      - colourPalette
      - reversePalette
      - plotTheme
      - textSize
      - alpha
      - lineWidth
      - pointSize
      - pointAlpha
      - pointColour
      - jitterSpread
      - valueLabel
      - title
      - showN
      - legendPos
      - legendTitle
      - boxWidth
      - boxOutliers
      - boxNotch
      - boxMean
      - boxJitter
  - name: plot_violin
    title: Violin plot
    type: Image
    width: 480
    height: 380
    renderFun: .plot_violin
